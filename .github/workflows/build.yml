# Builds the library on the pinned toolchain and Mathlib, then checks the axioms.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Check axioms and restated theorems
        shell: bash
        run: |
          lake env lean check/Axioms.lean | tee axioms.txt
          if grep -q -E "error|sorryAx" axioms.txt; then exit 1; fi
          test "$(grep -c 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' axioms.txt)" = "3"
